[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isac-v2x"
version = "0.1.0"
description = "Emergency-vehicle sensing and alerting over OpenISAC (ECE310 project)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
radar = ["numpy>=1.24", "pyzmq>=25"]     # density/radar_counter.py
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["isacv2x*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
